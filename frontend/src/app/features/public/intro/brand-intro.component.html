<main
  class="brand-intro-page min-h-screen w-full bg-navy text-n-0 flex flex-col justify-between relative overflow-hidden select-none"
  [class.intro-completed]="isCompleted"
  [class.reduced-motion]="prefersReducedMotion"
>
  <!-- Top Skip Control: Available immediately from frame 1 -->
  <header class="w-full flex justify-end px-4 sm:px-6 pt-4 sm:pt-6 z-20 min-h-[48px]">
    @if (!isCompleted) {
      <button
        id="btn-intro-skip"
        (click)="onSkip()"
        type="button"
        class="text-xs font-semibold tracking-wide text-n-400 hover:text-n-0 transition-colors py-2 px-3 rounded-lg min-h-[44px] min-w-[44px] flex items-center justify-center cursor-pointer"
        aria-label="Skip introduction animation"
      >
        Skip
      </button>
    }
  </header>

  <!-- Center Brand Mark & Wordmark & Tagline -->
  <section class="flex-grow flex flex-col items-center justify-center px-6 text-center my-auto">
    <!-- Reusable Vector Animated Logo -->
    <app-animated-logo
      [size]="88"
      [isCompleted]="isCompleted"
      [prefersReducedMotion]="prefersReducedMotion"
    />

    <!-- Wordmark: "Grih360" centered and large -->
    <h1 class="intro-wordmark text-3xl sm:text-4xl font-semibold tracking-tight text-n-0 mt-5 flex items-center justify-center">
      Grih<span class="text-brand">360</span>
    </h1>

    <!-- Plain Tagline (One line of plain text, no emoji, no em dashes) -->
    <p class="intro-tagline text-sm sm:text-base text-n-400 font-normal mt-3 max-w-xs sm:max-w-md tracking-normal">
      Find, verify and manage homes
    </p>
  </section>

  <!-- Bottom Action Buttons: Get Started & Sign In -->
  <footer class="intro-actions w-full max-w-xs mx-auto px-4 pb-8 sm:pb-12 flex flex-col items-center z-10">
    <a
      id="btn-intro-get-started"
      routerLink="/register"
      class="w-full min-h-[48px] py-3.5 px-6 rounded-xl bg-brand hover:bg-brand-hover text-n-0 text-sm font-semibold tracking-wide text-center flex items-center justify-center shadow-xs transition-colors cursor-pointer"
    >
      Get started
    </a>

    <a
      id="link-intro-sign-in"
      routerLink="/login"
      class="mt-3 text-xs font-semibold text-n-300 hover:text-n-0 transition-colors py-2 px-4 min-h-[44px] flex items-center justify-center cursor-pointer"
    >
      Sign in
    </a>
  </footer>
</main>
